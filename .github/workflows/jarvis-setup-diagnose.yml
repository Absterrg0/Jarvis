name: Jarvis Windows setup diagnostic

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Existing workflow run ID containing the Windows setup artifact"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    name: Diagnose silent Full install
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}

    steps:
      - name: Download setup artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactDir = Join-Path $env:RUNNER_TEMP 'jarvis-setup-diagnostic-artifact'
          New-Item -ItemType Directory -Path $artifactDir -Force | Out-Null
          gh run download "$env:SOURCE_RUN_ID" --repo "$env:GITHUB_REPOSITORY" --dir "$artifactDir"
          if ($LASTEXITCODE -ne 0) { throw "Could not download setup artifact from run $env:SOURCE_RUN_ID." }
          $installers = @(Get-ChildItem -LiteralPath $artifactDir -File -Recurse | Where-Object {
            $_.Name -match '^Jarvis-Setup-[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?-win-x64\.exe$'
          })
          if ($installers.Count -ne 1) {
            throw "Expected exactly one versioned Jarvis-Setup-<semver>-win-x64.exe, found $($installers.Count)."
          }
          "INSTALLER_PATH=$($installers[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Using installer: $($installers[0].FullName)"

      - name: Extract payload and run timed Full install diagnostic
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $logPath = Join-Path $env:RUNNER_TEMP 'jarvis-setup-diagnostic.log'
          $installRoot = Join-Path $env:RUNNER_TEMP 'jarvis-diagnose-install'
          $outerRoot = Join-Path $env:RUNNER_TEMP 'jarvis-diagnose-outer'
          $benchmarkRoot = Join-Path $env:RUNNER_TEMP 'jarvis-diagnose-benchmarks'
          New-Item -ItemType Directory -Path (Split-Path -Parent $logPath) -Force | Out-Null
          New-Item -ItemType Directory -Path $installRoot, $outerRoot, $benchmarkRoot -Force | Out-Null

          function Write-Diagnostic([string]$Message) {
            $line = "$(Get-Date -Format o) $Message"
            Add-Content -LiteralPath $logPath -Value $line -Encoding utf8
            Write-Host $line
          }

          function Find-SevenZip {
            foreach ($name in @('7z.exe', '7zz.exe', '7za.exe')) {
              $command = Get-Command $name -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($null -ne $command) { return $command.Source }
            }
            throw 'No runner 7z/7zz/7za executable was found.'
          }

          function Get-DescendantPids([int]$RootPid) {
            $processes = @(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue)
            $known = [System.Collections.Generic.HashSet[int]]::new()
            $queue = [System.Collections.Generic.Queue[int]]::new()
            $null = $known.Add($RootPid)
            $queue.Enqueue($RootPid)
            while ($queue.Count -gt 0) {
              $parent = $queue.Dequeue()
              foreach ($process in $processes | Where-Object { $_.ParentProcessId -eq $parent }) {
                if ($known.Add([int]$process.ProcessId)) { $queue.Enqueue([int]$process.ProcessId) }
              }
            }
            return @($known)
          }

          function Get-TreeDescription([int]$RootPid) {
            $processes = @(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue)
            $pids = @(Get-DescendantPids $RootPid)
            $interesting = $processes | Where-Object {
              ($pids -contains [int]$_.ProcessId) -or ($_.Name -match '(?i)nsis|7z|node|jarvis')
            }
            foreach ($process in $interesting) {
              $cpu = ''
              $mainWindowHandle = ''
              $mainWindowTitle = ''
              $responding = ''
              $threads = ''
              try {
                $runtimeProcess = Get-Process -Id ([int]$process.ProcessId) -ErrorAction Stop
                $cpu = $runtimeProcess.CPU
                $mainWindowHandle = $runtimeProcess.MainWindowHandle
                $mainWindowTitle = $runtimeProcess.MainWindowTitle
                $responding = $runtimeProcess.Responding
                $threads = $runtimeProcess.Threads.Count
              } catch { }
              Write-Diagnostic ("PROCESS pid={0} ppid={1} name={2} path={3} commandline={4} cpu={5} main_window_handle={6} main_window_title={7} responding={8} threads={9}" -f `
                $process.ProcessId, $process.ParentProcessId, $process.Name, $process.ExecutablePath, $process.CommandLine, $cpu, `
                $mainWindowHandle, $mainWindowTitle, $responding, $threads)
            }
          }

          function Get-TreeCounts([string]$Path) {
            if (-not (Test-Path -LiteralPath $Path)) {
              return 'count=0 bytes=0'
            }
            $files = @(Get-ChildItem -LiteralPath $Path -File -Recurse -Force -ErrorAction SilentlyContinue)
            $bytes = ($files | Measure-Object -Property Length -Sum).Sum
            if ($null -eq $bytes) { $bytes = 0 }
            return "count=$($files.Count) bytes=$bytes"
          }

          $sevenZip = Find-SevenZip
          Write-Diagnostic "SEVENZIP path=$sevenZip"
          Write-Diagnostic "OUTER_LIST_BEGIN installer=$env:INSTALLER_PATH"
          & $sevenZip l "$env:INSTALLER_PATH" 2>&1 | ForEach-Object { Write-Diagnostic "7Z_LIST $_" }
          if ($LASTEXITCODE -ne 0) { Write-Diagnostic "OUTER_LIST_STATUS exit=$LASTEXITCODE" }
          Write-Diagnostic 'OUTER_LIST_END'

          $outerExtracted = $false
          try {
            & $sevenZip x "$env:INSTALLER_PATH" "-o$outerRoot" -y -bso1 -bsp0 2>&1 | ForEach-Object { Write-Diagnostic "7Z_EXTRACT $_" }
            $extractExit = $LASTEXITCODE
            Write-Diagnostic "OUTER_EXTRACT_STATUS exit=$extractExit"
            $outerExtracted = ($extractExit -eq 0)
          } catch {
            Write-Diagnostic "OUTER_EXTRACT_ERROR $($_.Exception.Message)"
          }

          if ($outerExtracted) {
            $embedded = @(Get-ChildItem -LiteralPath $outerRoot -Filter '*.7z' -File -Recurse -ErrorAction SilentlyContinue)
            Write-Diagnostic "EMBEDDED_ARCHIVES count=$($embedded.Count)"
            foreach ($archive in $embedded) {
              $destination = Join-Path $benchmarkRoot ([IO.Path]::GetFileNameWithoutExtension($archive.Name))
              New-Item -ItemType Directory -Path $destination -Force | Out-Null
              $timer = [Diagnostics.Stopwatch]::StartNew()
              & $sevenZip x $archive.FullName "-o$destination" -y -bso1 -bsp0 2>&1 | ForEach-Object { Write-Diagnostic "7Z_BENCH $($_)" }
              $status = $LASTEXITCODE
              $timer.Stop()
              Write-Diagnostic "7Z_BENCH_RESULT archive=$($archive.Name) status=$status elapsed_ms=$($timer.ElapsedMilliseconds) $(Get-TreeCounts $destination)"
            }
          } else {
            Write-Diagnostic 'EMBEDDED_ARCHIVES skipped=outer-extraction-failed'
          }

          $installer = $null
          $timedOut = $false
          try {
            Write-Diagnostic "INSTALL_START root=$installRoot mode=Full deadline_seconds=120"
            $installer = Start-Process -FilePath $env:INSTALLER_PATH -ArgumentList @('/S', '/MODE=full', "/D=$installRoot") -PassThru
            $deadline = [DateTime]::UtcNow.AddSeconds(120)
            do {
              $rootState = Get-TreeCounts $installRoot
              $incomingState = Get-TreeCounts (Join-Path $installRoot '.incoming')
              $installerCpu = ''
              $installerMainWindowHandle = ''
              $installerMainWindowTitle = ''
              $installerResponding = ''
              $installerThreads = ''
              try {
                $installerProcess = Get-Process -Id $installer.Id -ErrorAction Stop
                $installerCpu = $installerProcess.CPU
                $installerMainWindowHandle = $installerProcess.MainWindowHandle
                $installerMainWindowTitle = $installerProcess.MainWindowTitle
                $installerResponding = $installerProcess.Responding
                $installerThreads = $installerProcess.Threads.Count
              } catch { }
              Write-Diagnostic ("SAMPLE installer_pid={0} installer_has_exited={1} installer_cpu={2} installer_main_window_handle={3} installer_main_window_title={4} installer_responding={5} installer_threads={6} install_root=[{7}] incoming=[{8}]" -f `
                $installer.Id, $installer.HasExited, $installerCpu, $installerMainWindowHandle, $installerMainWindowTitle, `
                $installerResponding, $installerThreads, $rootState, $incomingState)
              Get-TreeDescription $installer.Id
              if ($installer.HasExited) { break }
              if ([DateTime]::UtcNow -ge $deadline) {
                $timedOut = $true
                $descendants = @(Get-DescendantPids $installer.Id)
                Write-Diagnostic "TIMEOUT captured_installer_pid=$($installer.Id) captured_descendant_pids=$($descendants -join ',')"
                foreach ($processId in @($descendants | Sort-Object -Descending)) {
                  try { Stop-Process -Id $processId -Force -ErrorAction Stop; Write-Diagnostic "KILLED pid=$processId" } catch { Write-Diagnostic "KILL_SKIPPED pid=$processId reason=$($_.Exception.Message)" }
                }
                throw 'Full installer exceeded the 120-second deadline.'
              }
              Start-Sleep -Seconds 5
              $installer.Refresh()
            } while ($true)
            $installer.WaitForExit()
            Write-Diagnostic "INSTALL_EXIT pid=$($installer.Id) exit_code=$($installer.ExitCode) install_root=[$(Get-TreeCounts $installRoot)] incoming=[$(Get-TreeCounts (Join-Path $installRoot '.incoming'))]"
            if ($installer.ExitCode -ne 0) { throw "Full installer exited with code $($installer.ExitCode)." }
          } finally {
            if ($timedOut) { Write-Diagnostic 'INSTALL_RESULT timeout=true status=failed' }
            else { Write-Diagnostic 'INSTALL_RESULT timeout=false' }
          }

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jarvis-setup-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/jarvis-setup-diagnostic.log
          if-no-files-found: warn
          retention-days: 7
