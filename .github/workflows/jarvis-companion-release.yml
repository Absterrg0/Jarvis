name: Release Jarvis Companion

on:
  push:
    tags:
      - "jarvis-companion-v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jarvis-companion-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build and test Windows companion
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Verify companion
        run: |
          vp test run apps/companion/src/bubble-state.test.ts apps/companion/src/companion-presentation.test.ts apps/companion/src/companion-webgl.test.ts apps/companion/src/development.test.ts apps/companion/src/host.test.ts apps/companion/src/kokoro-lifecycle.test.ts apps/companion/src/kokoro-worker.test.ts apps/companion/src/launch.test.ts apps/companion/src/managed-status.test.ts apps/companion/src/native-microphone-regression.test.ts apps/companion/src/native-speech.test.ts apps/companion/src/recognition-evaluation.test.ts apps/companion/src/report-connection.test.ts apps/companion/src/setup-surface.test.ts apps/companion/src/speech-interrupt.test.ts apps/companion/src/updates.test.ts
          vp run --filter @jarvis/companion typecheck

      - name: Smoke native speech runtimes
        run: |
          vp run --filter @jarvis/companion prepare:voice
          vp run --filter @jarvis/companion smoke:voice

      - name: Verify release tag matches package
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = node -p "require('./apps/companion/package.json').version"
          $expected = "jarvis-companion-v$version"
          if ("${{ github.ref_name }}" -ne $expected) {
            throw "Tag '${{ github.ref_name }}' must match package version '$expected'."
          }

      - name: Build Windows installer
        run: vp run --filter @jarvis/companion package:win:ci

      - name: Smoke installed Companion speech
        shell: pwsh
        run: |
          $version = node -p "require('./apps/companion/package.json').version"
          $installerPath = (Resolve-Path "apps/companion/dist/Jarvis-Companion-$version-x64.exe").Path
          $installName = "jarvis-companion-speech-smoke-$([guid]::NewGuid().ToString('N'))"
          $installRoot = [System.IO.Path]::GetFullPath((Join-Path $env:RUNNER_TEMP $installName))
          $runnerTempRoot = [System.IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\', '/')
          $runnerTempPrefix = "$runnerTempRoot\"
          if (-not $installRoot.StartsWith($runnerTempPrefix, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "Refusing to install speech smoke outside RUNNER_TEMP: $installRoot"
          }
          New-Item -ItemType Directory -Path $installRoot -Force | Out-Null
          try {
            # electron-builder's NSIS template requires /D= to be the final,
            # unquoted argument; its parser treats the rest of the command line
            # as the path, which preserves spaces in RUNNER_TEMP.
            $installArgument = '/D=' + $installRoot
            $installer = Start-Process `
              -FilePath $installerPath `
              -ArgumentList @('/S', $installArgument) `
              -NoNewWindow `
              -Wait `
              -PassThru
            if ($installer.ExitCode -ne 0) {
              throw "Jarvis Companion installer failed with exit code $($installer.ExitCode)."
            }
            $installedExe = Join-Path $installRoot "Jarvis Companion.exe"
            if (-not (Test-Path -LiteralPath $installedExe -PathType Leaf)) {
              throw "Installed Jarvis Companion executable was not found at $installedExe."
            }
            $speechSmoke = Start-Process `
              -FilePath $installedExe `
              -ArgumentList @("--speech-smoke") `
              -NoNewWindow `
              -Wait `
              -PassThru
            if ($speechSmoke.ExitCode -ne 0) {
              throw "Installed Companion speech smoke failed with exit code $($speechSmoke.ExitCode)."
            }
          } finally {
            $uninstallerPath = Join-Path $installRoot "Uninstall Jarvis Companion.exe"
            if (Test-Path -LiteralPath $uninstallerPath -PathType Leaf) {
              $uninstaller = Start-Process `
                -FilePath $uninstallerPath `
                -ArgumentList @('/S') `
                -NoNewWindow `
                -Wait `
                -PassThru
              if ($uninstaller.ExitCode -ne 0) {
                throw "Jarvis Companion uninstaller failed with exit code $($uninstaller.ExitCode)."
              }
            }
            if (Test-Path -LiteralPath $installRoot) {
              $resolvedInstallRoot = [System.IO.Path]::GetFullPath(
                (Resolve-Path -LiteralPath $installRoot).Path
              )
              if (-not $resolvedInstallRoot.StartsWith($runnerTempPrefix, [System.StringComparison]::OrdinalIgnoreCase)) {
                throw "Refusing to remove speech smoke path outside RUNNER_TEMP: $resolvedInstallRoot"
              }
              Remove-Item -LiteralPath $resolvedInstallRoot -Recurse -Force
            }
          }

      - name: Upload test installer
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Companion-Windows-${{ github.run_number }}
          path: |
            apps/companion/dist/Jarvis-Companion-*-x64.exe
            apps/companion/dist/Jarvis-Companion-*-x64.exe.blockmap
            apps/companion/dist/latest.yml
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Build and test Linux companion
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Verify companion
        run: |
          vp test run apps/companion/src/bubble-state.test.ts apps/companion/src/companion-presentation.test.ts apps/companion/src/companion-webgl.test.ts apps/companion/src/development.test.ts apps/companion/src/host.test.ts apps/companion/src/kokoro-lifecycle.test.ts apps/companion/src/kokoro-worker.test.ts apps/companion/src/launch.test.ts apps/companion/src/linux-packaging.test.ts apps/companion/src/managed-status.test.ts apps/companion/src/native-microphone-regression.test.ts apps/companion/src/native-speech.test.ts apps/companion/src/recognition-evaluation.test.ts apps/companion/src/report-connection.test.ts apps/companion/src/setup-surface.test.ts apps/companion/src/speech-interrupt.test.ts apps/companion/src/updates.test.ts
          vp run --filter @jarvis/companion typecheck

      - name: Smoke native speech runtimes
        run: |
          vp run --filter @jarvis/companion prepare:voice
          vp run --filter @jarvis/companion smoke:voice

      - name: Verify release tag matches package
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(node -p "require('./apps/companion/package.json').version")"
          expected="jarvis-companion-v$version"
          test "$GITHUB_REF_NAME" = "$expected" || {
            echo "Tag '$GITHUB_REF_NAME' must match package version '$expected'." >&2
            exit 1
          }

      - name: Build Linux AppImage
        run: vp run --filter @jarvis/companion package:linux:ci

      - name: Smoke packaged Linux Companion
        run: |
          set -euo pipefail
          unpacked="apps/companion/dist/linux-unpacked"
          app_resources="$unpacked/resources/app.asar.unpacked"
          test -d "$unpacked"
          test -d "$app_resources/node_modules/sherpa-onnx-linux-x64"
          test -d "$app_resources/node_modules/node-cpal"
          test ! -e "$app_resources/node_modules/sherpa-onnx-win-x64"
          test -f "$app_resources/node_modules/node-cpal/bin/linux-x64/index.node"
          for directory in darwin-arm64 darwin-x64 win32-x64; do
            test ! -e "$app_resources/node_modules/node-cpal/bin/$directory"
          done
          test -f "$app_resources/node_modules/uiohook-napi/prebuilds/linux-x64/uiohook-napi.node"
          for directory in darwin-arm64 darwin-x64 win32-arm64 win32-x64; do
            test ! -e "$app_resources/node_modules/uiohook-napi/prebuilds/$directory"
          done
          test ! -e "$app_resources/node_modules/uiohook-napi/src"
          test ! -e "$app_resources/node_modules/uiohook-napi/libuiohook"
          node -e "for (const dependency of ['sherpa-onnx-linux-x64', 'node-cpal']) { const resolved = require.resolve(dependency, { paths: ['$PWD/$app_resources'] }); const loaded = require(resolved); if (!loaded || typeof loaded !== 'object' || Object.keys(loaded).length === 0) throw new Error('Packaged ' + dependency + ' exported no functions.'); }"
          mapfile -t appimages < <(find apps/companion/dist -maxdepth 1 -type f -name 'Jarvis-Companion-*-x86_64.AppImage' -print)
          test "${#appimages[@]}" -eq 1
          test -x "${appimages[0]}"

      - name: Upload test AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Companion-Linux-${{ github.run_number }}
          path: |
            apps/companion/dist/Jarvis-Companion-*-x86_64.AppImage
            apps/companion/dist/latest-linux.yml
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish Companion release
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read version
        run: echo "VERSION=$(node -p "require('./apps/companion/package.json').version")" >> "$GITHUB_ENV"

      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: Jarvis-Companion-Windows-${{ github.run_number }}
          path: release-assets/windows

      - name: Download Linux artifacts
        uses: actions/download-artifact@v8
        with:
          name: Jarvis-Companion-Linux-${{ github.run_number }}
          path: release-assets/linux

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="jarvis-companion-v$VERSION"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "Jarvis Companion v$VERSION" \
              --notes "Install once, then future Companion releases download differentially in the tray." \
              --latest
          fi
          gh release upload "$tag" \
            "release-assets/windows/Jarvis-Companion-$VERSION-x64.exe" \
            "release-assets/windows/Jarvis-Companion-$VERSION-x64.exe.blockmap" \
            "release-assets/windows/latest.yml" \
            "release-assets/linux/Jarvis-Companion-$VERSION-x86_64.AppImage" \
            "release-assets/linux/latest-linux.yml" \
            --clobber
