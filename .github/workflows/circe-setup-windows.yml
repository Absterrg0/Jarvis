name: Circe Windows setup

on:
  workflow_call:
    inputs:
      version:
        description: "Circe version to package (for example 1.2.3)"
        required: true
        type: string
      public_release:
        description: "Require Azure Trusted Signing and signed Windows payloads"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: "Circe version to package (for example 1.2.3)"
        required: true
        type: string
      public_release:
        description: "Require Azure Trusted Signing and signed Windows payloads"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-package:
    name: Build and verify Circe Setup package
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      setup_version: ${{ steps.resolve_version.outputs.version }}
    env:
      CIRCE_SETUP_VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Azure Trusted Signing release gate
        shell: pwsh
        env:
          CIRCE_PUBLIC_RELEASE: ${{ inputs.public_release }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: |
          $ErrorActionPreference = 'Stop'
          $publicRelease = $env:CIRCE_PUBLIC_RELEASE -eq 'true'
          if (-not $publicRelease) {
            Write-Host 'Public release disabled; continuing with an unsigned preview/manual verification.'
            "CIRCE_PUBLIC_RELEASE=false" | Out-File -FilePath $env:GITHUB_ENV -Append
            "CIRCE_WINDOWS_SIGNING_ENABLED=false" | Out-File -FilePath $env:GITHUB_ENV -Append
            exit 0
          }
          $required = [ordered]@{
            AZURE_TENANT_ID = $env:AZURE_TENANT_ID
            AZURE_CLIENT_ID = $env:AZURE_CLIENT_ID
            AZURE_CLIENT_SECRET = $env:AZURE_CLIENT_SECRET
            AZURE_TRUSTED_SIGNING_ENDPOINT = $env:AZURE_TRUSTED_SIGNING_ENDPOINT
            AZURE_TRUSTED_SIGNING_ACCOUNT_NAME = $env:AZURE_TRUSTED_SIGNING_ACCOUNT_NAME
            AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME = $env:AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME
            AZURE_TRUSTED_SIGNING_PUBLISHER_NAME = $env:AZURE_TRUSTED_SIGNING_PUBLISHER_NAME
          }
          $missing = @($required.GetEnumerator() | Where-Object { [string]::IsNullOrWhiteSpace($_.Value) } | ForEach-Object Name)
          $configured = $required.Count - $missing.Count
          if ($configured -gt 0 -and $configured -lt $required.Count) {
            throw "Azure Trusted Signing is only partially configured; missing: $($missing -join ', ')"
          }
          if ($publicRelease -and $configured -ne $required.Count) {
            throw 'Public Circe releases require all Azure Trusted Signing secrets.'
          }
          $enabled = $configured -eq $required.Count
          "CIRCE_PUBLIC_RELEASE=$($publicRelease.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CIRCE_WINDOWS_SIGNING_ENABLED=$($enabled.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Append
          if ($enabled) { Write-Host 'Azure Trusted Signing enabled for the Windows payload and outer setup.' }
          else { Write-Host 'Azure Trusted Signing disabled for this manual/debug build.' }

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Setup pnpm
        uses: pnpm/setup@v1
        with:
          package-json-file: package.json
          install: false

      - id: resolve_version
        name: Resolve version
        shell: pwsh
        run: |
          $version = "$env:CIRCE_SETUP_VERSION" -replace '^v', ''
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw "Invalid setup version: $version"
          }
          $packageVersion = (Get-Content apps/server/package.json -Raw | ConvertFrom-Json).version
          if ($version -ne $packageVersion) {
            throw "Setup version $version does not match package.json version $packageVersion."
          }
          "CIRCE_SETUP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Prepare Azure Trusted Signing for outer setup
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:CIRCE_WINDOWS_SIGNING_ENABLED -ne 'true') {
            Write-Host 'Azure Trusted Signing disabled; outer setup will remain unsigned.'
            exit 0
          }
          $requiredSecrets = @(
            $env:AZURE_TENANT_ID,
            $env:AZURE_CLIENT_ID,
            $env:AZURE_CLIENT_SECRET,
            $env:AZURE_TRUSTED_SIGNING_ENDPOINT,
            $env:AZURE_TRUSTED_SIGNING_ACCOUNT_NAME,
            $env:AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME,
            $env:AZURE_TRUSTED_SIGNING_PUBLISHER_NAME
          )
          $configuredSecrets = @($requiredSecrets | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }).Count
          if ($configuredSecrets -eq 0) {
            Write-Host 'Azure Trusted Signing disabled; outer setup will remain unsigned.'
            exit 0
          }
          if ($configuredSecrets -ne $requiredSecrets.Count) {
            throw 'Azure Trusted Signing is only partially configured.'
          }

          try {
            Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser -ErrorAction Stop
          } catch {
            Write-Warning "Could not bootstrap NuGet package provider; continuing with the runner provider. $($_.Exception.Message)"
          }
          Install-Module -Name TrustedSigning -RequiredVersion 0.5.0 -Force -AllowClobber -Repository PSGallery -Scope CurrentUser -ErrorAction Stop
          Import-Module TrustedSigning -RequiredVersion 0.5.0 -Force
          $trustedSigningModule = Get-Module TrustedSigning
          if ($null -eq $trustedSigningModule -or $trustedSigningModule.Version -ne [version]'0.5.0') { throw "TrustedSigning module version is not exactly 0.5.0: $($trustedSigningModule.Version)" }
          Get-Command Invoke-TrustedSigning -ErrorAction Stop

          $moduleRoots = @(
            [System.IO.Path]::Combine([Environment]::GetFolderPath('MyDocuments'), 'PowerShell', 'Modules'),
            [System.IO.Path]::Combine([Environment]::GetFolderPath('MyDocuments'), 'WindowsPowerShell', 'Modules'),
            [System.IO.Path]::Combine($env:ProgramFiles, 'PowerShell', 'Modules'),
            [System.IO.Path]::Combine($env:ProgramFiles, 'WindowsPowerShell', 'Modules')
          )
          $modulePathEntries = @($moduleRoots + ($env:PSModulePath -split ';')) |
            Where-Object { $_ -and (Test-Path $_) } |
            Select-Object -Unique
          "PSModulePath=$($modulePathEntries -join ';')" >> $env:GITHUB_ENV

      - name: Static setup contracts
        run: |
          function Invoke-Test {
            param([string[]] $Arguments)
            & vp test run @Arguments
            if ($LASTEXITCODE -ne 0) { throw "Test command failed with exit code $LASTEXITCODE`: vp test run $($Arguments -join ' ')" }
          }
          Invoke-Test @('scripts/stage-windows-runtime.test.ts')
          Invoke-Test @('scripts/windows-setup.test.ts')
          Invoke-Test @('scripts/build-windows-setup.test.ts')
          Invoke-Test @('scripts/windows-desktop-startup-smoke.test.ts')
          Invoke-Test @(
            'apps/desktop/src/app/DesktopLifecycle.test.ts',
            'apps/desktop/src/shell/DesktopCirceShell.test.ts',
            'apps/desktop/src/shell/DesktopCirceOverlay.test.ts'
          )
          Invoke-Test @(
            'apps/web/src/components/circe/CirceManager.logic.test.ts',
            'apps/web/src/components/circe/CirceOnboarding.logic.test.ts',
            'apps/web/src/components/circe/CircePresence.logic.test.ts',
            'apps/web/src/components/circe/CirceVoiceReporter.logic.test.ts'
          )
          Invoke-Test @('apps/server/src/server.test.ts', '--testNamePattern=controller')

      - name: Build desktop payload directory
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: |
          $buildArgs = @(
            'scripts/build-desktop-artifact.ts', '--platform', 'win', '--target', 'dir', '--arch', 'x64',
            '--build-version', $env:CIRCE_SETUP_VERSION,
            '--output-dir', "$env:RUNNER_TEMP\circe-desktop"
          )
          if ($env:CIRCE_WINDOWS_SIGNING_ENABLED -eq 'true') {
            $buildArgs += '--signed'
            Write-Host 'Building a Windows payload with Azure Trusted Signing enabled.'
          } else {
            Write-Host 'Building an unsigned Windows payload for a manual/debug run.'
          }
          & node @buildArgs
          if ($LASTEXITCODE -ne 0) { throw "Desktop payload build failed with exit code $LASTEXITCODE." }
          $payload = Get-ChildItem "$env:RUNNER_TEMP\circe-desktop" -Directory | Where-Object Name -eq 'win-unpacked' | Select-Object -First 1
          if ($null -eq $payload) { throw "Desktop win-unpacked payload was not produced." }
          $env:ELECTRON_RUN_AS_NODE = '1'
          $uiohookRoot = Join-Path $payload.FullName 'resources\app.asar.unpacked\node_modules\uiohook-napi'
          $uiohookBinary = Join-Path $uiohookRoot 'prebuilds\win32-x64\uiohook-napi.node'
          if (-not (Test-Path -LiteralPath $uiohookBinary -PathType Leaf)) { throw "uiohook-napi win32-x64 prebuild missing: $uiohookBinary" }
          foreach ($extra in @('darwin-arm64', 'darwin-x64', 'linux-arm64', 'linux-loong64', 'win32-arm64')) {
            if (Test-Path -LiteralPath (Join-Path $uiohookRoot "prebuilds\$extra")) { throw "Packaged Windows payload contains non-Windows uiohook-napi prebuild: $extra" }
          }
          & (Join-Path $payload.FullName 'Circe.exe') -e "const loaded = require(process.argv[1]); if (!loaded || typeof loaded.start !== 'function' || typeof loaded.stop !== 'function') throw new Error('Packaged uiohook-napi binding did not load in Electron Node mode.');" $uiohookBinary
          if ($LASTEXITCODE -ne 0) { throw "Packaged uiohook-napi Electron Node-mode load failed with exit code $LASTEXITCODE." }
          Remove-Item Env:ELECTRON_RUN_AS_NODE
          "CIRCE_DESKTOP_PAYLOAD=$($payload.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Smoke packaged Windows desktop lifecycle
        shell: pwsh
        run: |
          $probeRoot = Join-Path $env:RUNNER_TEMP 'circe-packaged-desktop-probe'
          pwsh -NoProfile -NonInteractive -File scripts/windows-desktop-startup-smoke.ps1 `
            -DesktopPath (Join-Path $env:CIRCE_DESKTOP_PAYLOAD 'Circe.exe') `
            -Version $env:CIRCE_SETUP_VERSION `
            -ProbeRoot $probeRoot

      - name: Stage standalone Windows runtime
        shell: pwsh
        run: |
          vp run --filter @absterrg0/circe build:bundle
          $deploy = Join-Path $env:RUNNER_TEMP 'circe-runtime-deploy'
          pnpm --config.inject-workspace-packages=true --config.node-linker=hoisted --config.package-import-method=copy --filter @absterrg0/circe deploy --prod $deploy
          if ($LASTEXITCODE -ne 0) { throw "Standalone runtime dependency staging failed with exit code $LASTEXITCODE." }
          $runtime = Join-Path $env:RUNNER_TEMP 'circe-runtime'
          New-Item -ItemType Directory -Path "$runtime\node" -Force | Out-Null
          node scripts/stage-windows-runtime.ts --source $deploy --target $runtime
          if ($LASTEXITCODE -ne 0) { throw "Standalone runtime payload staging failed with exit code $LASTEXITCODE." }
          if (Test-Path "$runtime\dist\client") { Remove-Item "$runtime\dist\client" -Recurse -Force }
          $nodeVersion = node -p "process.version"
          $archiveName = "node-$nodeVersion-win-x64.zip"
          $zip = Join-Path $env:RUNNER_TEMP $archiveName
          $checksums = Join-Path $env:RUNNER_TEMP 'SHASUMS256.txt'
          $nodeDist = "https://nodejs.org/dist/$nodeVersion"
          Invoke-WebRequest "$nodeDist/$archiveName" -OutFile $zip -ErrorAction Stop
          Invoke-WebRequest "$nodeDist/SHASUMS256.txt" -OutFile $checksums -ErrorAction Stop
          $checksumLines = @(Get-Content $checksums | Where-Object { $_ -match "\s$([regex]::Escape($archiveName))$" })
          if ($checksumLines.Count -ne 1) { throw "Official Node checksum entry for $archiveName was not unique." }
          $expectedNodeHash = ($checksumLines[0] -split '\s+')[0].ToLowerInvariant()
          $actualNodeHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualNodeHash -ne $expectedNodeHash) {
            throw "Node ZIP SHA256 mismatch for $archiveName. Expected $expectedNodeHash, got $actualNodeHash."
          }
          Write-Host "Verified official Node ZIP SHA256: $actualNodeHash"
          Expand-Archive $zip (Join-Path $env:RUNNER_TEMP 'node-extracted') -Force
          Copy-Item (Join-Path $env:RUNNER_TEMP "node-extracted\node-$nodeVersion-win-x64\node.exe") "$runtime\node\node.exe" -Force
          if (-not (Test-Path "$runtime\dist\bin.mjs")) { throw 'Standalone runtime bundle missing.' }
          if (-not (Test-Path "$runtime\node_modules")) { throw 'Standalone runtime dependencies missing.' }
          $runtimeHelp = & "$runtime\node\node.exe" "$runtime\dist\bin.mjs" --help 2>&1
          if ($LASTEXITCODE -ne 0) { throw "Standalone Windows runtime help smoke failed with exit code $LASTEXITCODE." }
          if (-not ($runtimeHelp -match 'Run the Circe server')) { throw 'Standalone Windows runtime help output did not identify the Circe server.' }
          $runtimeFiles = @(Get-ChildItem $runtime -File -Recurse)
          $runtimeBytes = ($runtimeFiles | Measure-Object -Property Length -Sum).Sum
          Write-Host "[setup-ci] Runtime payload: $($runtimeFiles.Count) files, $([math]::Round($runtimeBytes / 1MB, 1)) MiB"
          "CIRCE_RUNTIME_PAYLOAD=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build outer Circe Setup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\circe-setup-out" -Force | Out-Null
          node scripts/build-windows-setup.ts --version $env:CIRCE_SETUP_VERSION --arch x64 --source-commit $env:GITHUB_SHA --desktop-dir $env:CIRCE_DESKTOP_PAYLOAD --runtime-dir $env:CIRCE_RUNTIME_PAYLOAD --output-dir "$env:RUNNER_TEMP\circe-setup-out"
          $outputDir = "$env:RUNNER_TEMP\circe-setup-out"
          $artifact = Join-Path $outputDir "Circe-Setup-$env:CIRCE_SETUP_VERSION-win-x64.exe"
          "CIRCE_SETUP_OUTPUT_DIR=$outputDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CIRCE_SETUP_EXE=$artifact" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CIRCE_SETUP_ALIAS=$outputDir\Circe-Setup.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CIRCE_SETUP_MANIFEST=${artifact}.manifest.json" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CIRCE_SETUP_CHECKSUM=${artifact}.sha256" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CIRCE_SETUP_PROVENANCE=${artifact}.provenance.json" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Sign outer setup when Azure Trusted Signing is configured
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:CIRCE_WINDOWS_SIGNING_ENABLED -ne 'true') {
            Write-Host 'Azure Trusted Signing disabled; leaving outer setup unsigned.'
            exit 0
          }
          $requiredSecrets = @(
            $env:AZURE_TENANT_ID,
            $env:AZURE_CLIENT_ID,
            $env:AZURE_CLIENT_SECRET,
            $env:AZURE_TRUSTED_SIGNING_ENDPOINT,
            $env:AZURE_TRUSTED_SIGNING_ACCOUNT_NAME,
            $env:AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME,
            $env:AZURE_TRUSTED_SIGNING_PUBLISHER_NAME
          )
          $configuredSecrets = @($requiredSecrets | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }).Count
          if ($configuredSecrets -eq 0) {
            Write-Host 'Azure Trusted Signing disabled; leaving outer setup unsigned.'
            exit 0
          }
          if ($configuredSecrets -ne $requiredSecrets.Count) {
            throw 'Azure Trusted Signing is only partially configured.'
          }
          Import-Module TrustedSigning -RequiredVersion 0.5.0 -Force
          $trustedSigningModule = Get-Module TrustedSigning
          if ($null -eq $trustedSigningModule -or $trustedSigningModule.Version -ne [version]'0.5.0') { throw "TrustedSigning module version is not exactly 0.5.0: $($trustedSigningModule.Version)" }
          Get-Command Invoke-TrustedSigning -ErrorAction Stop
          $params = @{
            Endpoint = $env:AZURE_TRUSTED_SIGNING_ENDPOINT
            CodeSigningAccountName = $env:AZURE_TRUSTED_SIGNING_ACCOUNT_NAME
            CertificateProfileName = $env:AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME
            FilesFolder = $env:CIRCE_SETUP_OUTPUT_DIR
            FilesFolderFilter = 'exe'
            FileDigest = 'SHA256'
            TimestampRfc3161 = 'http://timestamp.acs.microsoft.com'
            TimestampDigest = 'SHA256'
          }
          Invoke-TrustedSigning @params
          Copy-Item -LiteralPath $env:CIRCE_SETUP_EXE -Destination $env:CIRCE_SETUP_ALIAS -Force
          foreach ($path in @($env:CIRCE_SETUP_EXE, $env:CIRCE_SETUP_ALIAS)) {
            $signature = Get-AuthenticodeSignature -LiteralPath $path
            if ($signature.Status -ne 'Valid') { throw "Trusted Signing verification failed for ${path}: $($signature.Status)" }
            $subject = $signature.SignerCertificate.Subject
            if ([string]::IsNullOrWhiteSpace($subject) -or $subject.IndexOf($env:AZURE_TRUSTED_SIGNING_PUBLISHER_NAME, [System.StringComparison]::OrdinalIgnoreCase) -lt 0) {
              throw "Trusted Signing publisher mismatch for ${path}: $subject"
            }
          }
          $hash = (Get-FileHash $env:CIRCE_SETUP_EXE -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $env:CIRCE_SETUP_EXE -Leaf)" | Set-Content -Path $env:CIRCE_SETUP_CHECKSUM -NoNewline -Encoding utf8
          $provenance = Get-Content $env:CIRCE_SETUP_PROVENANCE -Raw | ConvertFrom-Json
          $provenance.artifactSha256 = $hash
          $provenance.manifestSha256 = (Get-FileHash $env:CIRCE_SETUP_MANIFEST -Algorithm SHA256).Hash.ToLowerInvariant()
          $provenance | ConvertTo-Json -Depth 8 | Set-Content -Path $env:CIRCE_SETUP_PROVENANCE -Encoding utf8
          Write-Host "Verified Authenticode signature and refreshed outer setup SHA256: $hash"

      - name: Verify setup manifest and outer hash
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Payload SHA-256 values cover the exact staged bytes generated by
          # build-windows-setup.ts. Recompute them below against the two source payloads
          # plus the deterministic marker/launcher bytes added by the builder. The installer
          # uses completion markers; the outer setup sidecar/signature is the release boundary.
          $manifest = Get-Content $env:CIRCE_SETUP_MANIFEST -Raw | ConvertFrom-Json
          if ($manifest.format -ne 3 -or $manifest.product -ne 'Circe' -or $manifest.version -ne $env:CIRCE_SETUP_VERSION -or $manifest.platform -ne 'windows' -or $manifest.arch -ne 'x64' -or $manifest.sourceCommit -ne $env:GITHUB_SHA) {
            throw 'Setup manifest identity does not match the requested Windows release.'
          }
          if ($manifest.artifactName -ne (Split-Path $env:CIRCE_SETUP_EXE -Leaf)) { throw 'Setup manifest artifact name is incorrect.' }
          $verifyScript = Join-Path $env:RUNNER_TEMP 'verify-circe-setup-manifest.mjs'
          @'
          import * as crypto from 'node:crypto';
          import * as fs from 'node:fs/promises';
          import * as path from 'node:path';
          import { pathToFileURL } from 'node:url';

          const args = process.argv.slice(2);
          const installedMode = args[0] === '--installed';
          const manifestPath = installedMode ? args[1] : args[0];
          const manifest = JSON.parse(await fs.readFile(manifestPath, 'utf8'));
          async function collectFiles(root) {
            const files = [];
            async function visit(directory) {
              for (const entry of await fs.readdir(directory, { withFileTypes: true })) {
                const absolute = path.join(directory, entry.name);
                if (entry.isDirectory()) {
                  await visit(absolute);
                } else if (entry.isFile()) {
                  files.push(path.posix.normalize(path.relative(root, absolute).replaceAll('\\', '/')));
                } else {
                  throw new Error(`Installed payload contains unsupported entry: ${absolute}`);
                }
              }
            }
            await visit(root);
            return files.sort();
          }
          async function verifyInstalledPayload(payload, root) {
            const expected = new Map(payload.files.map((file) => [file.path, file]));
            const actual = await collectFiles(root);
            const actualSet = new Set(actual);
            const extras = actual.filter((file) => !expected.has(file));
            const missing = [...expected.keys()].filter((file) => !actualSet.has(file));
            if (extras.length || missing.length) {
              throw new Error(`Installed ${payload.id} differs from manifest. Missing: ${missing[0] ?? 'none'}; extra: ${extras[0] ?? 'none'}`);
            }
            for (const file of payload.files) {
              const bytes = await fs.readFile(path.join(root, file.path));
              const hash = crypto.createHash('sha256').update(bytes).digest('hex');
              if (bytes.byteLength !== file.bytes || hash !== file.sha256) {
                throw new Error(`Installed payload hash mismatch: ${payload.id}/${file.path}`);
              }
            }
          }
          if (installedMode) {
            const installRoot = args[2];
            const payloadIds = (args[3] ?? '').split(',').filter(Boolean);
            for (const payloadId of payloadIds) {
              const payload = manifest.payloads.find(({ id }) => id === payloadId);
              if (!payload) throw new Error(`Unknown installed payload: ${payloadId}`);
              await verifyInstalledPayload(payload, path.join(installRoot, payloadId));
            }
            console.log(`Verified installed payload bytes: ${payloadIds.join(', ')}`);
            process.exit(0);
          }
          const [, desktopRoot, runtimeRoot] = args;
          const roots = { desktop: desktopRoot, 'runtime-win': runtimeRoot };
          const { renderWindowsNodeLauncherCmd, renderWindowsNodeStopPs1, renderWindowsNodeSupervisorMjs } = await import(
            pathToFileURL(path.join(process.cwd(), 'scripts/windows-setup.ts')).href,
          );
          const marker = Buffer.from('Circe\n', 'utf8');
          const t3PackageRoots = [];
          let checked = 0;
          for (const payload of manifest.payloads) {
            const root = roots[payload.id];
            if (!root) throw new Error(`Unknown payload ${payload.id}`);
            for (const file of payload.files) {
              if (
                typeof file.path !== 'string' ||
                path.isAbsolute(file.path) ||
                file.path.split(/[\\/]/u).includes('..')
              ) {
                throw new Error(`Unsafe payload path: ${payload.id}/${file.path}`);
              }
              let bytes;
              if (file.path === 'circe-payload-complete.txt') {
                bytes = marker;
              } else if (payload.id === 'runtime-win' && file.path === 'circe-node-launcher.cmd') {
                bytes = Buffer.from(renderWindowsNodeLauncherCmd(), 'utf8');
              } else if (payload.id === 'runtime-win' && file.path === 'circe-node-supervisor.mjs') {
                bytes = Buffer.from(renderWindowsNodeSupervisorMjs(), 'utf8');
              } else if (payload.id === 'runtime-win' && file.path === 'circe-node-stop.ps1') {
                bytes = Buffer.from(renderWindowsNodeStopPs1(), 'utf8');
              } else {
                bytes = await fs.readFile(path.join(root, file.path));
              }
              const hash = crypto.createHash('sha256').update(bytes).digest('hex');
              if (bytes.byteLength !== file.bytes || hash !== file.sha256) {
                throw new Error(`Payload hash mismatch: ${payload.id}/${file.path}`);
              }
              if (payload.id === 'runtime-win' && path.posix.basename(file.path) === 'package.json') {
                const packageJson = JSON.parse(bytes.toString('utf8'));
                if (packageJson.name === '@t3tools/web') {
                  throw new Error(`Forbidden @t3tools/web package in runtime payload: ${file.path}`);
                }
                if (packageJson.name === 't3') {
                  t3PackageRoots.push(path.posix.dirname(file.path));
                }
              }
              checked += 1;
            }
          }
          const runtimePayload = manifest.payloads.find(({ id }) => id === 'runtime-win');
          if (!runtimePayload) throw new Error('Missing runtime-win payload.');
          for (const file of runtimePayload.files) {
            for (const packageRoot of t3PackageRoots) {
              const relative = path.posix.relative(packageRoot, file.path);
              if (
                relative === 'src' || relative.startsWith('src/') ||
                relative === 'dist/client' || relative.startsWith('dist/client/') ||
                (relative.startsWith('dist/') && relative.endsWith('.map'))
              ) {
                throw new Error(`Forbidden t3 source/UI file in runtime payload: ${file.path}`);
              }
            }
          }
          console.log(`Recomputed ${checked} payload hashes.`);
          '@ | Set-Content -Path $verifyScript -Encoding utf8
          "CIRCE_MANIFEST_VERIFIER=$verifyScript" | Out-File -FilePath $env:GITHUB_ENV -Append
          node $verifyScript $env:CIRCE_SETUP_MANIFEST $env:CIRCE_DESKTOP_PAYLOAD $env:CIRCE_RUNTIME_PAYLOAD
          if ($LASTEXITCODE -ne 0) { throw 'Payload manifest hash recomputation failed.' }
          $seen = @{}
          $seenPayloads = @{}
          foreach ($payload in @($manifest.payloads)) {
            if ($payload.id -notin @('desktop', 'runtime-win')) { throw "Unexpected payload id: $($payload.id)" }
            if ($seenPayloads.ContainsKey($payload.id)) { throw "Duplicate payload id: $($payload.id)" }
            $seenPayloads[$payload.id] = $true
            $expectedModes = if ($payload.id -eq 'runtime-win') { 'headless' } else { 'full,controller' }
            if ((@($payload.modes) -join ',') -ne $expectedModes) { throw "Unexpected modes for payload $($payload.id): $(@($payload.modes) -join ',')" }
            foreach ($file in @($payload.files)) {
              if ([string]::IsNullOrWhiteSpace($file.path) -or $file.path -match '(^|[\\/])\.\.([\\/]|$)' -or [System.IO.Path]::IsPathRooted($file.path)) { throw "Unsafe manifest path: $($file.path)" }
              if ($file.bytes -lt 0 -or $file.sha256 -notmatch '^[0-9a-fA-F]{64}$') { throw "Invalid manifest hash entry: $($payload.id)/$($file.path)" }
              $key = "$($payload.id)/$($file.path)"
              if ($seen.ContainsKey($key)) { throw "Duplicate manifest path: $key" }
              $seen[$key] = $true
            }
          }
          if ($seenPayloads.Count -ne 2 -or -not $seenPayloads.ContainsKey('desktop') -or -not $seenPayloads.ContainsKey('runtime-win')) {
            throw 'Setup manifest does not contain exactly the desktop and runtime-win payloads.'
          }
          $runtimePaths = @(
            $manifest.payloads |
              Where-Object { $_.id -eq 'runtime-win' } |
              ForEach-Object { $_.files } |
              ForEach-Object { $_.path }
          )
          $forbiddenRuntimePaths = @($runtimePaths | Where-Object {
            $_ -match '(^|[\\/])@t3tools[\\/]web([\\/]|$)' -or
            $_ -match '(^|[\\/])@t3tools[+]web([\\/]|@|$)' -or
            $_ -match '(^|[\\/])t3[\\/]dist[\\/]client([\\/]|$)' -or
            $_ -match '(^|[\\/])t3[\\/]src([\\/]|$)' -or
            $_ -match '(^|[\\/])t3[\\/]dist[\\/].*[.]map$' -or
            $_ -match '^dist[\\/]client([\\/]|$)' -or
            $_ -match '^src([\\/]|$)' -or
            $_ -match '^dist[\\/].*[.]map$'
          })
          if ($forbiddenRuntimePaths.Count -gt 0) {
            throw "Forbidden UI/source files remain in runtime-win manifest: $($forbiddenRuntimePaths[0])"
          }
          $actualHash = (Get-FileHash $env:CIRCE_SETUP_EXE -Algorithm SHA256).Hash.ToLowerInvariant()
          $sidecar = (Get-Content $env:CIRCE_SETUP_CHECKSUM -Raw).Trim()
          if ($sidecar -notmatch "^$actualHash\s+$([regex]::Escape((Split-Path $env:CIRCE_SETUP_EXE -Leaf)))$") { throw 'Setup SHA256 sidecar does not match the outer installer.' }
          $aliasHash = (Get-FileHash $env:CIRCE_SETUP_ALIAS -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($aliasHash -ne $actualHash) { throw 'Versioned setup and Circe-Setup.exe differ.' }
          $manifestHash = (Get-FileHash $env:CIRCE_SETUP_MANIFEST -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifestChecksum = "${env:CIRCE_SETUP_MANIFEST}.sha256"
          "$manifestHash  $(Split-Path $env:CIRCE_SETUP_MANIFEST -Leaf)" | Set-Content -Path $manifestChecksum -NoNewline -Encoding utf8
          $provenance = Get-Content $env:CIRCE_SETUP_PROVENANCE -Raw | ConvertFrom-Json
          if ($provenance.format -ne 1 -or $provenance.product -ne 'Circe' -or $provenance.version -ne $env:CIRCE_SETUP_VERSION -or $provenance.arch -ne 'x64' -or $provenance.sourceCommit -ne $env:GITHUB_SHA -or $provenance.artifactName -ne (Split-Path $env:CIRCE_SETUP_EXE -Leaf) -or $provenance.aliasName -ne (Split-Path $env:CIRCE_SETUP_ALIAS -Leaf) -or $provenance.manifestName -ne (Split-Path $env:CIRCE_SETUP_MANIFEST -Leaf) -or $provenance.provenanceName -ne (Split-Path $env:CIRCE_SETUP_PROVENANCE -Leaf) -or $provenance.artifactSha256 -ne $actualHash -or $provenance.manifestSha256 -ne $manifestHash) {
            throw 'Setup provenance does not bind the verified artifact, manifest, source commit, and release identity.'
          }
          Write-Host "Verified manifest schema ($($seen.Count) payload files) and outer SHA256: $actualHash"

      - name: Stage standalone clean-install verifier
        shell: pwsh
        run: |
          Copy-Item scripts/verify-windows-setup.mjs "$env:CIRCE_SETUP_OUTPUT_DIR\verify-windows-setup.mjs" -Force

      - name: Upload setup artifacts
        uses: actions/upload-artifact@v4
        with:
          name: circe-setup-windows-${{ steps.resolve_version.outputs.version }}
          compression-level: 0
          path: |
            ${{ env.CIRCE_SETUP_EXE }}
            ${{ env.CIRCE_SETUP_OUTPUT_DIR }}/*.manifest.json
            ${{ env.CIRCE_SETUP_OUTPUT_DIR }}/*.provenance.json
            ${{ env.CIRCE_SETUP_OUTPUT_DIR }}/*.sha256
            ${{ env.CIRCE_SETUP_OUTPUT_DIR }}/verify-windows-setup.mjs
          if-no-files-found: error
          retention-days: 14

  clean-install-test:
    name: Clean-machine install, health, upgrade, and uninstall
    needs: build-package
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CIRCE_SETUP_VERSION: ${{ needs.build-package.outputs.setup_version }}

    steps:
      - name: Download setup artifacts (no repository checkout)
        uses: actions/download-artifact@v8
        with:
          name: circe-setup-windows-${{ needs.build-package.outputs.setup_version }}
          path: ${{ runner.temp }}/circe-setup-download

      - name: Verify release metadata and install every supported mode
        shell: pwsh
        env:
          CIRCE_PUBLIC_RELEASE: ${{ inputs.public_release }}
          CIRCE_EXPECTED_PUBLISHER: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Invoke-SetupLifecycleProcess {
            param(
              [Parameter(Mandatory = $true)] [string] $Label,
              [Parameter(Mandatory = $true)] [string] $FilePath,
              [Parameter(Mandatory = $true)] [string[]] $ArgumentList
            )
            $started = Get-Date
            $process = Start-Process -FilePath $FilePath -ArgumentList $ArgumentList -PassThru
            if (-not $process.WaitForExit(600000)) {
              $elapsed = ((Get-Date) - $started).TotalSeconds
              Write-Host "[setup-ci] $Label timed out after $([math]::Round($elapsed, 1))s (PID $($process.Id)); stopping that process."
              if (-not $process.HasExited) {
                $null = Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              }
              throw "$Label timed out after $([math]::Round($elapsed, 1)) seconds."
            }
            $process.Refresh()
            $elapsed = ((Get-Date) - $started).TotalSeconds
            Write-Host "[setup-ci] $Label finished in $([math]::Round($elapsed, 1))s (exit $($process.ExitCode))"
            if ($process.ExitCode -ne 0) {
              throw "$Label failed: $($process.ExitCode)"
            }
            return $process
          }
          function Wait-ForInstallRootRemoval {
            param(
              [Parameter(Mandatory = $true)] [string] $Label,
              [Parameter(Mandatory = $true)] [string] $InstallRoot
            )
            $exactRoot = [System.IO.Path]::GetFullPath($InstallRoot)
            $deadline = (Get-Date).AddSeconds(15)
            do {
              if (-not (Test-Path -LiteralPath $exactRoot)) {
                Write-Host "[setup-ci] $Label removed the exact install root: $exactRoot"
                return
              }
              Start-Sleep -Milliseconds 250
            } while ((Get-Date) -lt $deadline)

            if (Test-Path -LiteralPath $exactRoot) {
              Write-Host "[setup-ci] $Label still has the exact install root after the bounded wait: $exactRoot"
              $remainingEntries = @(
                Get-ChildItem -LiteralPath $exactRoot -Force -ErrorAction SilentlyContinue |
                  Select-Object -First 25
              )
              if ($remainingEntries.Count -eq 0) {
                Write-Host '[setup-ci] Exact install root remains but contains no readable entries.'
              } else {
                Write-Host '[setup-ci] Remaining exact-root entries (diagnostics capped at the first 25):'
                foreach ($entry in $remainingEntries) {
                  Write-Host "[setup-ci] Remaining exact-root entry: $($entry.FullName)"
                }
              }
              throw "$Label did not remove the exact install root within 15 seconds: $exactRoot"
            }
          }
          function Invoke-InstalledDesktopProbe {
            param(
              [Parameter(Mandatory = $true)] [string] $Label,
              [Parameter(Mandatory = $true)] [string] $InstallRoot
            )
            $probeRoot = Join-Path $env:RUNNER_TEMP ("circe-desktop-probe-" + [guid]::NewGuid().ToString('N'))
            New-Item -ItemType Directory -Path $probeRoot -Force | Out-Null
            $probeFile = Join-Path $probeRoot 'startup-receipt.json'
            $stdoutPath = Join-Path $probeRoot 'main.stdout.log'
            $stderrPath = Join-Path $probeRoot 'main.stderr.log'
            $desktopPath = Join-Path $InstallRoot 'desktop\Circe.exe'
            if (-not (Test-Path -LiteralPath $desktopPath -PathType Leaf)) { throw "$Label desktop executable missing: $desktopPath" }
            $desktop = Start-Process -FilePath $desktopPath -ArgumentList @('--no-sandbox', "--circe-startup-probe=$probeFile") -WorkingDirectory (Split-Path $desktopPath) -Environment @{ T3CODE_HOME = (Join-Path $probeRoot 't3-home'); CIRCE_STARTUP_PROBE_FILE = $probeFile; CIRCE_STARTUP_PROBE_QUIT = '1' } -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath -PassThru
            try {
              $deadline = (Get-Date).AddSeconds(90)
              $receipt = $null
              do {
                if (Test-Path -LiteralPath $probeFile -PathType Leaf) {
                  try { $receipt = Get-Content -LiteralPath $probeFile -Raw | ConvertFrom-Json } catch { }
                  if ($null -ne $receipt) { break }
                }
                if ($desktop.HasExited) { throw "$Label exited before writing a startup receipt (exit $($desktop.ExitCode))." }
                Start-Sleep -Milliseconds 250
              } while ((Get-Date) -lt $deadline)
              if ($null -eq $receipt -or $receipt.schemaVersion -ne 1 -or $receipt.product -ne 'Circe' -or $receipt.version -ne $env:CIRCE_SETUP_VERSION -or $receipt.platform -ne 'win32' -or $receipt.phase -ne 'main-window-revealed') {
                throw "$Label did not produce a valid main-window-revealed startup receipt."
              }
              Write-Host "[setup-ci] $Label receipt is valid (PID $($desktop.Id))."
              if (-not $desktop.WaitForExit(30000)) {
                throw "$Label did not complete its graceful quit within 30 seconds."
              }
              $desktop.Refresh()
              if ($desktop.ExitCode -ne 0) {
                throw "$Label graceful quit failed with exit code $($desktop.ExitCode)."
              }
              $stdout = if (Test-Path -LiteralPath $stdoutPath) { Get-Content -LiteralPath $stdoutPath -Raw } else { '' }
              $stderr = if (Test-Path -LiteralPath $stderrPath) { Get-Content -LiteralPath $stderrPath -Raw } else { '' }
              $combinedOutput = "$stdout`n$stderr"
              if ($combinedOutput -match '(?i)object has been destroyed') {
                throw "$Label reported a destroyed-window main-process failure."
              }
              if ($combinedOutput -match '(?i)\buncaught\b|\bunhandled rejection\b') {
                throw "$Label reported an uncaught main-process failure."
              }
            } finally {
              if (-not $desktop.HasExited) {
                Write-Host "[setup-ci] Stopping only captured $Label PID $($desktop.Id)."
                Stop-Process -Id $desktop.Id -Force -ErrorAction SilentlyContinue
              }
              $desktop.WaitForExit(30000)
              $stdout = if (Test-Path -LiteralPath $stdoutPath) { Get-Content -LiteralPath $stdoutPath -Raw } else { '' }
              $stderr = if (Test-Path -LiteralPath $stderrPath) { Get-Content -LiteralPath $stderrPath -Raw } else { '' }
              $combinedOutput = "$stdout`n$stderr"
              if ($combinedOutput.Length -gt 32768) {
                $combinedOutput = $combinedOutput.Substring($combinedOutput.Length - 32768)
              }
              if (-not [string]::IsNullOrWhiteSpace($combinedOutput)) {
                Write-Host "[setup-ci] Bounded $Label main-process output (last 32768 chars):"
                Write-Host $combinedOutput
              }
              Remove-Item -LiteralPath $probeRoot -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          function Assert-CirceRegistration {
            param(
              [Parameter(Mandatory = $true)] [bool] $Installed,
              [Parameter(Mandatory = $true)] [string] $InstallRoot
            )
            $uninstallRoot = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall'
            $circeEntries = @(Get-ChildItem -LiteralPath $uninstallRoot -ErrorAction SilentlyContinue | Where-Object { $_.PSChildName -eq 'Circe' })
            $legacyCompanionEntry = Join-Path $uninstallRoot '0f1dda33-2afd-5844-b03e-82589eb138e8'
            if (Test-Path -LiteralPath $legacyCompanionEntry) { throw 'Legacy Companion uninstall registry entry remains.' }
            if ($Installed) {
              if ($circeEntries.Count -ne 1) { throw "Expected exactly one Circe installed-app entry, found $($circeEntries.Count)." }
              $displayIcon = [string](Get-ItemProperty -LiteralPath (Join-Path $uninstallRoot 'Circe')).DisplayIcon
              $displayIcon = $displayIcon.Trim().Trim('"')
              $expectedDisplayIcon = [System.IO.Path]::GetFullPath((Join-Path -Path $InstallRoot -ChildPath 'desktop\Circe.exe'))
              if (-not [System.String]::Equals($displayIcon, $expectedDisplayIcon, [System.StringComparison]::OrdinalIgnoreCase)) {
                throw "Circe DisplayIcon does not target the installed desktop executable: $displayIcon (expected $expectedDisplayIcon)"
              }
            } elseif ($circeEntries.Count -ne 0) {
              throw "Circe installed-app entry remains after uninstall: $($circeEntries.Count)."
            }
          }
          function Assert-AuthenticodePublisher {
            param(
              [Parameter(Mandatory = $true)] [string] $Label,
              [Parameter(Mandatory = $true)] [string] $Path
            )
            if ($env:CIRCE_PUBLIC_RELEASE -ne 'true') { return }
            if ([string]::IsNullOrWhiteSpace($env:CIRCE_EXPECTED_PUBLISHER)) {
              throw 'Public release signature verification has no expected Azure Trusted Signing publisher.'
            }
            $signature = Get-AuthenticodeSignature -LiteralPath $Path
            if ($signature.Status -ne 'Valid') { throw "Authenticode verification failed for ${Label}: $($signature.Status)" }
            $subject = $signature.SignerCertificate.Subject
            if ([string]::IsNullOrWhiteSpace($subject) -or $subject.IndexOf($env:CIRCE_EXPECTED_PUBLISHER, [System.StringComparison]::OrdinalIgnoreCase) -lt 0) {
              throw "Authenticode publisher mismatch for ${Label}: $subject"
            }
            Write-Host "Verified Authenticode signature for ${Label}: $subject"
          }
          $download = Join-Path $env:RUNNER_TEMP 'circe-setup-download'
          $artifact = @(Get-ChildItem $download -Recurse -File -Filter "Circe-Setup-$env:CIRCE_SETUP_VERSION-win-x64.exe")
          $manifest = @(Get-ChildItem $download -Recurse -File -Filter "Circe-Setup-$env:CIRCE_SETUP_VERSION-win-x64.exe.manifest.json")
          $checksum = @(Get-ChildItem $download -Recurse -File -Filter "Circe-Setup-$env:CIRCE_SETUP_VERSION-win-x64.exe.sha256")
          $provenance = @(Get-ChildItem $download -Recurse -File -Filter "Circe-Setup-$env:CIRCE_SETUP_VERSION-win-x64.exe.provenance.json")
          $verifier = @(Get-ChildItem $download -Recurse -File -Filter 'verify-windows-setup.mjs')
          foreach ($candidates in @($artifact, $manifest, $checksum, $provenance, $verifier)) {
            if ($candidates.Count -ne 1) { throw 'Clean install artifact did not contain exactly one installer, manifest, checksum, provenance, and verifier.' }
          }
          $artifactPath = $artifact[0].FullName
          $aliasPath = Join-Path $download 'Circe-Setup.exe'
          Copy-Item -LiteralPath $artifactPath -Destination $aliasPath -Force
          Write-Host "[setup-ci] Reconstructed stable alias: $aliasPath"
          $manifestPath = $manifest[0].FullName
          $checksumPath = $checksum[0].FullName
          $provenancePath = $provenance[0].FullName
          $verifierPath = $verifier[0].FullName
          Assert-AuthenticodePublisher -Label 'downloaded outer setup' -Path $artifactPath
          Write-Host '[setup-ci] Verifying downloaded bundle metadata.'
          node $verifierPath bundle $artifactPath $aliasPath $manifestPath $checksumPath $provenancePath
          if ($LASTEXITCODE -ne 0) { throw 'Standalone release verifier rejected the downloaded setup bundle.' }

          $root = Join-Path $env:RUNNER_TEMP 'circe-installed'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          Write-Host "[setup-ci] Full install starting: $artifactPath"
          $null = Invoke-SetupLifecycleProcess -Label 'Full install' -FilePath $artifactPath -ArgumentList @('/S', '/MODE=full', "/D=$root")
          if (-not (Test-Path "$root\desktop\Circe.exe")) { throw 'Full desktop payload missing.' }
          Assert-AuthenticodePublisher -Label 'installed Full Circe.exe' -Path "$root\desktop\Circe.exe"
          if (Test-Path "$root\companion") { throw 'Full install left a Companion payload directory.' }
          node $verifierPath installed $manifestPath $root desktop
          if ($LASTEXITCODE -ne 0) { throw 'Installed Full desktop payload bytes do not match the manifest.' }
          $fullPreset = Get-Content "$env:USERPROFILE\.circe\config\node-preset.json" -Raw | ConvertFrom-Json
          if ($fullPreset.preset -ne 'full' -or $fullPreset.nodeType -ne 'full') { throw 'Full preset was not persisted.' }
          Assert-CirceRegistration -Installed $true -InstallRoot $root
          Invoke-InstalledDesktopProbe -Label 'Full Desktop' -InstallRoot $root
          New-Item -ItemType Directory -Path "$env:USERPROFILE\.circe\userdata" -Force | Out-Null
          'preserve-me' | Set-Content "$env:USERPROFILE\.circe\userdata\setup-ci-sentinel.txt"

          Write-Host '[setup-ci] Full uninstall before clean Controller install.'
          $null = Invoke-SetupLifecycleProcess -Label 'Full uninstall' -FilePath "$root\Uninstall Circe.exe" -ArgumentList @('/S')
          Wait-ForInstallRootRemoval -Label 'Full uninstall' -InstallRoot $root
          Assert-CirceRegistration -Installed $false -InstallRoot $root
          if (-not (Test-Path "$env:USERPROFILE\.circe\userdata\setup-ci-sentinel.txt")) { throw 'Full uninstall deleted user data.' }
          New-Item -ItemType Directory -Path $root -Force | Out-Null

          Write-Host '[setup-ci] Clean Controller install starting.'
          $null = Invoke-SetupLifecycleProcess -Label 'Clean Controller install' -FilePath $artifactPath -ArgumentList @('/S', '/MODE=controller', "/D=$root")
          if (-not (Test-Path "$root\desktop\Circe.exe")) { throw 'Clean Controller desktop payload missing.' }
          Assert-AuthenticodePublisher -Label 'installed Controller Circe.exe' -Path "$root\desktop\Circe.exe"
          if (Test-Path "$root\companion") { throw 'Clean Controller install left a Companion payload directory.' }
          node $verifierPath installed $manifestPath $root desktop
          if ($LASTEXITCODE -ne 0) { throw 'Clean Controller desktop payload bytes do not match the manifest.' }
          $cleanControllerPreset = Get-Content "$env:USERPROFILE\.circe\config\node-preset.json" -Raw | ConvertFrom-Json
          if ($cleanControllerPreset.preset -ne 'controller' -or $cleanControllerPreset.nodeType -ne 'controller') { throw 'Clean Controller preset was not persisted.' }
          Assert-CirceRegistration -Installed $true -InstallRoot $root
          Invoke-InstalledDesktopProbe -Label 'Clean Controller Desktop' -InstallRoot $root

          Write-Host '[setup-ci] Controller upgrade starting.'
          $null = Invoke-SetupLifecycleProcess -Label 'Controller upgrade' -FilePath $artifactPath -ArgumentList @('/S', '/MODE=controller', "/D=$root")
          $started = Get-Date
          Write-Host '[setup-ci] Controller payload verification starting.'
          node $verifierPath installed $manifestPath $root desktop
          Write-Host "[setup-ci] Controller payload verification finished in $([math]::Round(((Get-Date) - $started).TotalSeconds, 1))s"
          if ($LASTEXITCODE -ne 0) { throw 'Installed controller payload bytes do not match the manifest.' }
          if (-not (Test-Path "$root\desktop\Circe.exe")) { throw 'Controller desktop payload missing.' }
          Assert-AuthenticodePublisher -Label 'upgraded Controller Circe.exe' -Path "$root\desktop\Circe.exe"
          if (Test-Path "$root\companion") { throw 'Controller upgrade left a Companion payload directory.' }
          if (-not (Test-Path "$env:USERPROFILE\.circe\userdata\setup-ci-sentinel.txt")) { throw 'Controller upgrade deleted user data.' }
          $controllerPreset = Get-Content "$env:USERPROFILE\.circe\config\node-preset.json" -Raw | ConvertFrom-Json
          if ($controllerPreset.preset -ne 'controller' -or $controllerPreset.nodeType -ne 'controller') { throw 'Controller preset was not persisted.' }
          if (Test-Path "$root\runtime-win") { throw 'Controller upgrade left the headless runtime payload behind.' }
          Invoke-InstalledDesktopProbe -Label 'Controller Desktop' -InstallRoot $root

          Write-Host '[setup-ci] Headless upgrade starting.'
          $null = Invoke-SetupLifecycleProcess -Label 'Headless upgrade' -FilePath $artifactPath -ArgumentList @('/S', '/MODE=headless', "/D=$root")
          $preset = Get-Content "$env:USERPROFILE\.circe\config\node-preset.json" -Raw | ConvertFrom-Json
          if ($preset.preset -ne 'headless' -or $preset.nodeType -ne 'headless') { throw 'Headless preset was not persisted.' }
          if (-not (Test-Path "$root\runtime-win\node\node.exe")) { throw 'Headless runtime payload missing.' }
          if (Test-Path "$root\desktop") { throw 'Headless install left the desktop payload behind.' }
          if (Test-Path "$root\companion") { throw 'Headless install left a Companion payload directory.' }
          $started = Get-Date
          Write-Host '[setup-ci] Headless payload verification starting.'
          node $verifierPath installed $manifestPath $root runtime-win
          Write-Host "[setup-ci] Headless payload verification finished in $([math]::Round(((Get-Date) - $started).TotalSeconds, 1))s"
          if ($LASTEXITCODE -ne 0) { throw 'Installed headless payload bytes do not match the manifest.' }
          Write-Host '[setup-ci] Waiting for the headless runtime health descriptor.'
          $task = Get-ScheduledTask -TaskName 'Circe Headless Node' -ErrorAction SilentlyContinue
          if ($null -eq $task -or $task.State -notin @('Running', 'Ready')) { throw 'Headless scheduled task was not ready.' }
          $healthDeadline = (Get-Date).AddSeconds(45)
          $descriptor = $null
          do {
            try {
              $candidate = Invoke-RestMethod -Uri 'http://127.0.0.1:3773/.well-known/t3/environment' -TimeoutSec 3
              if ($candidate.capabilities.circeNode.preset -eq 'headless' -and $candidate.capabilities.circeNode.execution -eq $true) {
                $descriptor = $candidate
                break
              }
            } catch {
              # The scheduled task may still be starting the bundled runtime.
            }
            Start-Sleep -Seconds 1
          } while ((Get-Date) -lt $healthDeadline)
          if ($null -eq $descriptor) {
            Write-Host '[setup-ci] Headless runtime diagnostics:'
            $taskInfo = Get-ScheduledTaskInfo -TaskName 'Circe Headless Node' -ErrorAction SilentlyContinue
            if ($null -ne $taskInfo) {
              Write-Host "LastTaskResult=$($taskInfo.LastTaskResult) LastRunTime=$($taskInfo.LastRunTime) NextRunTime=$($taskInfo.NextRunTime)"
            }
            $task = Get-ScheduledTask -TaskName 'Circe Headless Node' -ErrorAction SilentlyContinue
            if ($null -ne $task) {
              foreach ($action in @($task.Actions)) {
                Write-Host "TaskAction Execute=$($action.Execute) Arguments=$($action.Arguments) WorkingDirectory=$($action.WorkingDirectory)"
              }
            }
            $runtimeNodePath = [System.IO.Path]::GetFullPath("$root\runtime-win\node\node.exe")
            $runtimeProcesses = @(Get-CimInstance Win32_Process -Filter "Name = 'node.exe'" -ErrorAction SilentlyContinue | Where-Object {
              $_.ExecutablePath -eq $runtimeNodePath
            })
            foreach ($process in $runtimeProcesses) {
              Write-Host "RuntimeNodeProcess PID=$($process.ProcessId) Executable=$($process.ExecutablePath) CommandLine=$($process.CommandLine)"
            }
            $portOwners = @(Get-NetTCPConnection -LocalPort 3773 -ErrorAction SilentlyContinue)
            foreach ($connection in $portOwners) {
              Write-Host "Port3773Connection PID=$($connection.OwningProcess) State=$($connection.State) LocalAddress=$($connection.LocalAddress) LocalPort=$($connection.LocalPort)"
            }
            throw 'Headless runtime did not expose a healthy headless descriptor.'
          }

          $runtimeNodePath = [System.IO.Path]::GetFullPath("$root\runtime-win\node\node.exe")
          $runtimeServerCommand = "$root\runtime-win\dist\bin.mjs"
          $runtimeSupervisorCommand = "$root\runtime-win\circe-node-supervisor.mjs"
          $runtimeProcesses = @(
            Get-CimInstance Win32_Process -Filter "Name = 'node.exe'" -ErrorAction SilentlyContinue |
              Where-Object {
                [System.String]::Equals($_.ExecutablePath, $runtimeNodePath, [System.StringComparison]::OrdinalIgnoreCase) -and
                $_.CommandLine -and $_.CommandLine.IndexOf($runtimeServerCommand, [System.StringComparison]::OrdinalIgnoreCase) -ge 0
              }
          )
          if ($runtimeProcesses.Count -ne 1) { throw "Expected exactly one bundled headless server child, found $($runtimeProcesses.Count)." }
          $firstHeadlessServerPid = $runtimeProcesses[0].ProcessId

          Write-Host "[setup-ci] Restarting the exact bundled headless server child PID $firstHeadlessServerPid."
          Stop-Process -Id $firstHeadlessServerPid -Force
          $restartDeadline = (Get-Date).AddSeconds(45)
          $restartedDescriptor = $null
          $restartedServerPid = $null
          do {
            $candidateServers = @(
              Get-CimInstance Win32_Process -Filter "Name = 'node.exe'" -ErrorAction SilentlyContinue |
                Where-Object {
                  [System.String]::Equals($_.ExecutablePath, $runtimeNodePath, [System.StringComparison]::OrdinalIgnoreCase) -and
                  $_.CommandLine -and $_.CommandLine.IndexOf($runtimeServerCommand, [System.StringComparison]::OrdinalIgnoreCase) -ge 0
                }
            )
            if ($candidateServers.Count -eq 1 -and $candidateServers[0].ProcessId -ne $firstHeadlessServerPid) {
              try {
                $candidateDescriptor = Invoke-RestMethod -Uri 'http://127.0.0.1:3773/.well-known/t3/environment' -TimeoutSec 3
                if ($candidateDescriptor.capabilities.circeNode.preset -eq 'headless' -and $candidateDescriptor.capabilities.circeNode.execution -eq $true) {
                  $restartedDescriptor = $candidateDescriptor
                  $restartedServerPid = $candidateServers[0].ProcessId
                  break
                }
              } catch {
                # The supervisor is expected to restart the child after its bounded delay.
              }
            }
            Start-Sleep -Seconds 1
          } while ((Get-Date) -lt $restartDeadline)
          if ($null -eq $restartedDescriptor -or $null -eq $restartedServerPid) { throw 'Headless supervisor did not restart a new healthy exact server child.' }
          Write-Host "[setup-ci] Headless supervisor restarted exact server child PID $restartedServerPid."

          $supervisorProcesses = @(
            Get-CimInstance Win32_Process -Filter "Name = 'node.exe'" -ErrorAction SilentlyContinue |
              Where-Object {
                [System.String]::Equals($_.ExecutablePath, $runtimeNodePath, [System.StringComparison]::OrdinalIgnoreCase) -and
                $_.CommandLine -and $_.CommandLine.IndexOf($runtimeSupervisorCommand, [System.StringComparison]::OrdinalIgnoreCase) -ge 0
              }
          )
          if ($supervisorProcesses.Count -ne 1) { throw "Expected exactly one bundled supervisor, found $($supervisorProcesses.Count)." }
          $firstSupervisorPid = $supervisorProcesses[0].ProcessId
          Write-Host "[setup-ci] Restarting the exact bundled supervisor PID $firstSupervisorPid through its launcher."
          Stop-Process -Id $firstSupervisorPid -Force -ErrorAction SilentlyContinue
          $orphanCleanupDeadline = (Get-Date).AddSeconds(15)
          $orphanServers = @()
          do {
            $orphanServers = @(
              Get-CimInstance Win32_Process -Filter "Name = 'node.exe'" -ErrorAction SilentlyContinue |
                Where-Object {
                  [System.String]::Equals($_.ExecutablePath, $runtimeNodePath, [System.StringComparison]::OrdinalIgnoreCase) -and
                  $_.CommandLine -and $_.CommandLine.IndexOf($runtimeServerCommand, [System.StringComparison]::OrdinalIgnoreCase) -ge 0
                }
            )
            if ($orphanServers.Count -eq 0) { break }
            Start-Sleep -Milliseconds 500
          } while ((Get-Date) -lt $orphanCleanupDeadline)
          if ($orphanServers.Count -ne 0) { throw 'Supervisor crash cleanup left the old exact server child running.' }
          $supervisorRestartDeadline = (Get-Date).AddSeconds(45)
          $restartedSupervisorPid = $null
          $restartedServerAfterSupervisorPid = $null
          $supervisorRestartedDescriptor = $null
          do {
            $candidateSupervisors = @(
              Get-CimInstance Win32_Process -Filter "Name = 'node.exe'" -ErrorAction SilentlyContinue |
                Where-Object {
                  [System.String]::Equals($_.ExecutablePath, $runtimeNodePath, [System.StringComparison]::OrdinalIgnoreCase) -and
                  $_.CommandLine -and $_.CommandLine.IndexOf($runtimeSupervisorCommand, [System.StringComparison]::OrdinalIgnoreCase) -ge 0
                }
            )
            $candidateServersAfterSupervisor = @(
              Get-CimInstance Win32_Process -Filter "Name = 'node.exe'" -ErrorAction SilentlyContinue |
                Where-Object {
                  [System.String]::Equals($_.ExecutablePath, $runtimeNodePath, [System.StringComparison]::OrdinalIgnoreCase) -and
                  $_.CommandLine -and $_.CommandLine.IndexOf($runtimeServerCommand, [System.StringComparison]::OrdinalIgnoreCase) -ge 0
                }
            )
            if ($candidateSupervisors.Count -eq 1 -and $candidateSupervisors[0].ProcessId -ne $firstSupervisorPid -and
                $candidateServersAfterSupervisor.Count -eq 1 -and $candidateServersAfterSupervisor[0].ProcessId -ne $restartedServerPid) {
              try {
                $candidateDescriptor = Invoke-RestMethod -Uri 'http://127.0.0.1:3773/.well-known/t3/environment' -TimeoutSec 3
                if ($candidateDescriptor.capabilities.circeNode.preset -eq 'headless' -and $candidateDescriptor.capabilities.circeNode.execution -eq $true) {
                  $supervisorRestartedDescriptor = $candidateDescriptor
                  $restartedSupervisorPid = $candidateSupervisors[0].ProcessId
                  $restartedServerAfterSupervisorPid = $candidateServersAfterSupervisor[0].ProcessId
                  break
                }
              } catch {
                # The CMD launcher waits five seconds before starting a new supervisor.
              }
            }
            Start-Sleep -Seconds 1
          } while ((Get-Date) -lt $supervisorRestartDeadline)
          if ($null -eq $supervisorRestartedDescriptor -or $null -eq $restartedSupervisorPid -or $null -eq $restartedServerAfterSupervisorPid) { throw 'CMD did not restart a new supervisor with a new healthy exact server child.' }
          Write-Host "[setup-ci] CMD restarted supervisor PID $restartedSupervisorPid and server child PID $restartedServerAfterSupervisorPid."

          Write-Host '[setup-ci] Headless to Controller reverse upgrade starting.'
          $null = Invoke-SetupLifecycleProcess -Label 'Headless to Controller upgrade' -FilePath $artifactPath -ArgumentList @('/S', '/MODE=controller', "/D=$root")
          node $verifierPath installed $manifestPath $root desktop
          if ($LASTEXITCODE -ne 0) { throw 'Reverse controller payload bytes do not match the manifest.' }
          if (-not (Test-Path "$root\desktop\Circe.exe")) { throw 'Reverse controller desktop payload is missing.' }
          Assert-AuthenticodePublisher -Label 'reverse-upgraded Controller Circe.exe' -Path "$root\desktop\Circe.exe"
          if (Test-Path "$root\companion") { throw 'Reverse controller left a Companion payload directory.' }
          if (-not (Test-Path "$env:USERPROFILE\.circe\userdata\setup-ci-sentinel.txt")) { throw 'Reverse controller upgrade deleted user data.' }
          $reverseControllerPreset = Get-Content "$env:USERPROFILE\.circe\config\node-preset.json" -Raw | ConvertFrom-Json
          if ($reverseControllerPreset.preset -ne 'controller' -or $reverseControllerPreset.nodeType -ne 'controller') { throw 'Reverse controller preset was not persisted.' }
          $controllerShutdownDeadline = (Get-Date).AddSeconds(30)
          do {
            $remainingTask = Get-ScheduledTask -TaskName 'Circe Headless Node' -ErrorAction SilentlyContinue
            $remainingProcesses = @(Get-CimInstance Win32_Process -Filter "Name = 'node.exe'" -ErrorAction SilentlyContinue | Where-Object { [System.String]::Equals($_.ExecutablePath, $runtimeNodePath, [System.StringComparison]::OrdinalIgnoreCase) })
            $endpointResponding = $false
            try { $null = Invoke-WebRequest -Uri 'http://127.0.0.1:3773/.well-known/t3/environment' -TimeoutSec 2; $endpointResponding = $true } catch { }
            if ($null -eq $remainingTask -and $remainingProcesses.Count -eq 0 -and -not $endpointResponding) { break }
            Start-Sleep -Milliseconds 500
          } while ((Get-Date) -lt $controllerShutdownDeadline)
          if ($null -ne $remainingTask -or $remainingProcesses.Count -ne 0 -or $endpointResponding) { throw 'Headless to Controller upgrade left the task, endpoint, or bundled runtime process running.' }

          Write-Host '[setup-ci] Controller to Headless upgrade starting.'
          $null = Invoke-SetupLifecycleProcess -Label 'Controller to Headless upgrade' -FilePath $artifactPath -ArgumentList @('/S', '/MODE=headless', "/D=$root")
          node $verifierPath installed $manifestPath $root runtime-win
          if ($LASTEXITCODE -ne 0) { throw 'Second headless payload bytes do not match the manifest.' }
          $secondPreset = Get-Content "$env:USERPROFILE\.circe\config\node-preset.json" -Raw | ConvertFrom-Json
          if ($secondPreset.preset -ne 'headless' -or $secondPreset.nodeType -ne 'headless') { throw 'Second headless preset was not persisted.' }
          $secondHealthDeadline = (Get-Date).AddSeconds(45)
          $secondDescriptor = $null
          do {
            try {
              $candidate = Invoke-RestMethod -Uri 'http://127.0.0.1:3773/.well-known/t3/environment' -TimeoutSec 3
              if ($candidate.capabilities.circeNode.preset -eq 'headless' -and $candidate.capabilities.circeNode.execution -eq $true) {
                $secondDescriptor = $candidate
                break
              }
            } catch {
              # The scheduled task may still be starting the bundled runtime.
            }
            Start-Sleep -Seconds 1
          } while ((Get-Date) -lt $secondHealthDeadline)
          if ($null -eq $secondDescriptor) { throw 'Second headless install did not expose a healthy descriptor.' }

          Write-Host '[setup-ci] Uninstall starting.'
          $null = Invoke-SetupLifecycleProcess -Label 'Uninstall' -FilePath "$root\Uninstall Circe.exe" -ArgumentList @('/S')
          Wait-ForInstallRootRemoval -Label 'Uninstall' -InstallRoot $root
          Assert-CirceRegistration -Installed $false -InstallRoot $root
          if (Test-Path "$root\companion") { throw 'Uninstall left a Companion payload directory.' }
          if (-not (Test-Path "$env:USERPROFILE\.circe\userdata\setup-ci-sentinel.txt")) { throw 'Uninstall deleted user data.' }
          $shutdownDeadline = (Get-Date).AddSeconds(30)
          do {
            $endpointResponding = $false
            try { $null = Invoke-WebRequest -Uri 'http://127.0.0.1:3773/.well-known/t3/environment' -TimeoutSec 2; $endpointResponding = $true } catch { }
            $remainingTask = Get-ScheduledTask -TaskName 'Circe Headless Node' -ErrorAction SilentlyContinue
            $remainingProcesses = @(Get-CimInstance Win32_Process -Filter "Name = 'node.exe'" -ErrorAction SilentlyContinue | Where-Object {
              [System.String]::Equals($_.ExecutablePath, $runtimeNodePath, [System.StringComparison]::OrdinalIgnoreCase) -or
              ($_.CommandLine -and $_.CommandLine.IndexOf("$root\runtime-win", [System.StringComparison]::OrdinalIgnoreCase) -ge 0)
            })
            if (-not $endpointResponding -and $null -eq $remainingTask -and $remainingProcesses.Count -eq 0) { break }
            Start-Sleep -Milliseconds 500
          } while ((Get-Date) -lt $shutdownDeadline)
          if ($endpointResponding -or $null -ne $remainingTask -or $remainingProcesses.Count -gt 0) { throw 'Uninstall left the headless endpoint, task, or bundled Node process running.' }
