[package]
name = "jarvis-native-microphone"
version = "0.1.1"
license = "ISC"
edition = "2021"
exclude = ["index.node"]

[lib]
crate-type = ["cdylib"]

[dependencies]
neon = "1"
cpal = "0.15.2"
uuid = { version = "1.6", features = ["v4"] }
parking_lot = "0.12"
lazy_static = "1.4"
crossbeam-channel = "0.5"
once_cell = "1.19.0"

[profile.release]
lto = true
